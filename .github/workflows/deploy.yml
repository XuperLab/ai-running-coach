name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export -p web --no-minify

      - name: Fix paths for GitHub Pages subdirectory
        run: |
          cd dist
          # Fix absolute paths in index.html to be relative to /ai-running-coach/
          sed -i 's|src="/_expo/|src="/ai-running-coach/_expo/|g' index.html
          sed -i 's|href="/favicon.ico"|href="/ai-running-coach/favicon.ico"|g' index.html
          # Fix any other absolute asset references
          sed -i 's|="/assets/|="/ai-running-coach/assets/|g' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
